VpcID=vpc-0eb9e5f6ee7548e00
SubnetIds=subnet-0efb3c776ffa5cf6a,subnet-00d2a4aaa4301785d
ImageId=/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
InstanceType=t3a.medium
InstanceName=amazon-ec2-gitlab-runner
VolumeSize=200
VolumeType=gp3
MaxSize=4
MinSize=1
DesiredCapacity=1
MaxBatchSize=1
MinInstancesInService=1
# Seconds before an instance is replaced for its age; 0 never does (at least 86400 otherwise)
MaxInstanceLifetime=0
GitlabServerURL="https://gitlab.com"
DockerImagePath="registry.gitlab.com/exampleuser/gitlab-runner:latest"
# Comma separated runner authentication tokens (glrt-...). Stored as an SSM SecureString on deploy;
# leave empty to keep the tokens already stored for the stack.
RunnersToken=glrt-exampletoken1,glrt-exampletoken2
LambdaS3Bucket=amazon-ec2-gitlab-runner-demo
Concurrent=2
CheckInterval=3
# Idle job slots kept free before adding an instance
CountOfNewJobsBeforeScaling=2
# Optional: comma separated IDs of the GitLab project runners this stack runs, and a token that can
# read them and their projects' jobs (a project access token with the Maintainer role and read_api
# scope). With both, the monitor also scales out for jobs waiting in GitLab. The token is stored as
# an SSM SecureString on deploy; leave it empty to keep the one already stored.
GitlabRunnerIds=
GitlabApiToken=
# Swap file size in GiB (0 disables), and memory limits for each job's build and service containers,
# which can't swap: a job over its limit is killed
SwapSize=4
JobMemoryLimit=1536m
ServiceMemoryLimit=512m
# /dev/shm size in bytes for each job's build container; 0 keeps Docker's 64 MB
JobShmSize=0
# Image pull policies tried in order; if-not-present reuses an image on the instance by tag, so push each build with its own tag
DockerPullPolicy=if-not-present,always
# Days before job cache archives are deleted from the shared S3 cache bucket
CacheExpirationDays=14
CostCenter=10000
AppId=1111
GitlabRunnerVersion=latest
AssociatePublicIpAddress=false
