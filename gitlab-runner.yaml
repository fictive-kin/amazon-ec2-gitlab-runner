AWSTemplateFormatVersion: "2010-09-09"
Description: "Setting up Gitlab CI Runner AutoScalingGroup"
Parameters:
  VpcID:
    Type: "AWS::EC2::VPC::Id"
    Description: "VPC ID on which EC2 runner instance will reside"
  SubnetIds:
    Type: "List<AWS::EC2::Subnet::Id>"
    Description: "Use Private App Subnets"
  ImageId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: SSM parameter name that resolves to the AMI ID used to create the EC2 runner instance. Defaults to the latest Amazon Linux 2023 AMI.
  InstanceType:
    Type: "String"
    Default: "t3a.medium"
    Description: "Instance type for EC2 runner instance"
  InstanceName:
    Type: "String"
    Default: "gitlab-runner"
    Description: "Name of the runner instance being created"
  VolumeSize:
    Type: "Number"
    Default: 200
    Description: "Volume size"
  VolumeType:
    Type: "String"
    Default: "gp3"
    Description: "Volume Type Attached to instance"
  MaxSize:
    Type: "Number"
    Default: 6
    Description: "The maximum number of instances in the EC2 autoscaling group."
  MinSize:
    Type: "Number"
    Default: 1
    Description: "The minimum number of instances in the EC2 autoscaling group."
  DesiredCapacity:
    Type: "Number"
    Default: 1
    Description: "The size of the Auto Scaling group."
  MaxBatchSize:
    Type: "Number"
    Default: 1
    Description: "The maximum number of instances that AWS CloudFormation updates at once."
  MinInstancesInService:
    Type: "Number"
    Default: 1
    Description: "The minimum number of instances that must be in service within the Auto Scaling group while CloudFormation updates old instances."
  MaxInstanceLifetime:
    Type: Number
    Description: The maximum amount of time, in seconds, that an instance can be in service. If specified, the value must be either 0 or a number equal to or greater than 86,400 seconds (1 day).
    Default: 604800
  GitlabServerURL:
    Type: String
    Description: URL of the Gitlab server
  DockerImagePath:
    Type: String
    Description: Docker path of the GitLab Runner Docker image    
  LambdaS3Bucket:
    Type: String
    Default: ""
    Description: "The s3 bucket to store the lambda functions in"
  TimeStamp:
    Type: "String"
    Description: "A timestamp for this deployment. This is used to identify the correct lambda code on S3 for deployment."
  Concurrent: 
    Type: "Number"
    Description: "Number of concurrent jobs allowed on a Gitlab Runner"
  CheckInterval:
    Type: "Number"
    Description: "The interval length, in seconds, between new jobs check. If set to 0 or lower, the default value will be used."
  CostCenter:
    Type: String
    Description: Cost center code for the application.
  AppId:
    Type: String
    Description: ID of the application.
  ScaleInCoolDownInSeconds:
    Type: Number
    Default: 600
    Description: The delay before we begin scaling down an autoscaling group. Scale Up does not obey this value.
  CountOfNewJobsBeforeScaling:
    Type: Number
    Default: 2
    Description: The number of jobs that we should be able to take before needing to wait on a scaling event.
  AssociatePublicIpAddress:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Give runner instances a public IP. Set to "true" when SubnetIds are public subnets without a NAT gateway.
  GitlabRunnerVersion:
    Type: String
    Default: "latest"
    Description: GitLab Runner version to install from the official GitLab package repository (e.g. 18.5.0), or "latest".
  SwapSize:
    Type: Number
    Default: 4
    MinValue: 0
    Description: Size in GiB of a swap file on the root volume, so a memory spike slows the instance instead of hanging it. 0 disables swap.
  JobMemoryLimit:
    Type: String
    Default: "1536m"
    AllowedPattern: "^[0-9]+[bkmg]?$"
    Description: Memory limit for each job's build container (docker --memory, e.g. 1536m or 2g). Containers started through the mounted docker socket are not limited.
  ServiceMemoryLimit:
    Type: String
    Default: "512m"
    AllowedPattern: "^[0-9]+[bkmg]?$"
    Description: Memory limit for each service container of a job (docker --memory, e.g. 512m).
  DockerPullPolicy:
    Type: String
    Default: "if-not-present,always"
    AllowedPattern: "^(always|if-not-present|never)(,(always|if-not-present|never))*$"
    Description: Comma separated image pull policies, tried in order until one succeeds. if-not-present reuses an image already on the instance by tag without checking the registry, so give each image build its own tag (setup-runner.sh tags builds with the git commit).
  CacheExpirationDays:
    Type: Number
    Default: 14
    MinValue: 1
    Description: Days after which job cache archives (the cache keyword in .gitlab-ci.yml) are deleted from the shared S3 cache bucket. GitLab rewrites a cache archive each time a job saves it, so a cache still in use is kept.

Conditions:
  PinGitlabRunnerVersion: !Not [!Equals [!Ref GitlabRunnerVersion, "latest"]]

Resources:
  GitlabRunnerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchAgentAdminPolicy'
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
  InstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref GitlabRunnerRole
  GitlabRunnerPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowInvokeLambda
            Action: 'lambda:InvokeFunction'
            Resource: !GetAtt LifeCycleHookFunction.Arn
            Effect: Allow
          - Sid: AllowSSMParameterStoreRead
            Action: 'ssm:GetParameter*'
            # SecureString written by deploy-runner.sh; CloudFormation cannot create SecureString parameters
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/runner-tokens'
            Effect: Allow
          - Sid: AllowSSMDocumentRead
            Action:
              - 'ssm:ListDocuments'
              - 'ssm:ListCommandInvocations'
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:*'
            Effect: Allow
          - Sid: AllowSSMDocumentSend
            Action: 
              - 'ssm:SendCommand'
            Resource: 
              - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:document/${Document}'
            Effect: Allow            
          - Sid: AllowPublishRunnerMetrics
            Action: 'cloudwatch:PutMetricData'
            Resource: '*'
            Condition:
              StringEquals:
                'cloudwatch:namespace': !Sub '${AWS::StackName}-runner-metrics'
            Effect: Allow
          - Sid: AllowCompleteLifycycle
            Action: 'autoscaling:CompleteLifecycleAction'
            Resource: !Sub 'arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-asg'
            Effect: Allow
          # The runner signs cache URLs with the instance role; job containers never get the credentials
          - Sid: AllowCacheBucketList
            Action: 's3:ListBucket'
            Resource: !GetAtt RunnerCacheBucket.Arn
            Effect: Allow
          - Sid: AllowCacheObjects
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
              - 's3:DeleteObject'
            Resource: !Sub '${RunnerCacheBucket.Arn}/*'
            Effect: Allow
      ManagedPolicyName: !Sub ${AWS::StackName}-policy
      Roles:
        - !Ref GitlabRunnerRole

  # Shared job cache, so a cache saved on one instance is found on the others and outlives
  # instance replacement. Retained on stack deletion; empty and delete it by hand.
  RunnerCacheBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCache
            Status: Enabled
            ExpirationInDays: !Ref CacheExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  RunnerSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: !Join [ "", [ "Security group for ", !Ref "InstanceName" ] ]
      VpcId: !Ref "VpcID"

  RunnerLaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    DependsOn: GitlabRunnerRole
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-launch-template
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: !Ref VolumeType
              Encrypted: true
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        # IMDSv2 only. Hop limit 2 lets job containers on the docker bridge network reach instance metadata.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        # Hostname is the instance ID (i-....ec2.internal), so each job log's "Running on ... via"
        # line and the instance's logs name the instance
        PrivateDnsNameOptions:
          HostnameType: resource-name
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: !Ref AssociatePublicIpAddress
            Groups:
              - !GetAtt RunnerSecurityGroup.GroupId
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            # The setup in Metadata runs once, at launch; changing Metadata alone doesn't create a new
            # launch template version, so instances wouldn't be replaced. The settings it uses are listed
            # here so that changing one replaces the instances. Bump SetupRevision after editing Metadata.
            # SetupRevision=2 Concurrent=${Concurrent} CheckInterval=${CheckInterval} GitlabServerURL=${GitlabServerURL}
            # DockerImagePath=${DockerImagePath} DockerPullPolicy=${DockerPullPolicy} GitlabRunnerVersion=${GitlabRunnerVersion}
            # JobMemoryLimit=${JobMemoryLimit} ServiceMemoryLimit=${ServiceMemoryLimit} SwapSize=${SwapSize}
            yum update -y aws-cfn-bootstrap
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackId} --resource RunnerLaunchTemplate --region ${AWS::Region}
            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackId} --resource RunnerAutoScalingGroup --region ${AWS::Region}
    # Runs once at launch; there is no cfn-hup, because re-running these commands on a running
    # instance re-registers the runner and resets the machine ID. Changes roll out by replacing
    # instances instead (see UserData).
    Metadata:
      'AWS::CloudFormation::Init':
        config:
          files:
            /etc/gitlab-runner/config.toml:
              content: !Sub |
                concurrent = ${Concurrent}
                check_interval = ${CheckInterval}
                listen_address = "127.0.0.1:9252"
                log_format = "json"
            # Publishes this instance's running job count for the runner monitor Lambda to scale on,
            # and its CPU, memory, swap and memory pressure for watch-runner-jobs.sh
            /usr/local/bin/publish-runner-metrics:
              mode: '000755'
              content: !Sub |
                #!/bin/bash
                set -euo pipefail
                TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                INSTANCE_ID=$(curl -sf -H "X-aws-ec2-metadata-token: ${!TOKEN}" http://169.254.169.254/latest/meta-data/instance-id)
                JOB_COUNT=$(curl -sf http://127.0.0.1:9252/metrics | awk 'index($0, "gitlab_runner_jobs{") == 1 { sum += $NF } END { print sum + 0 }')
                # CPU busy % since the previous run, from the /proc/stat counters saved then
                read -r _ user nice system idle iowait irq softirq steal _ < /proc/stat
                CPU_TOTAL=$((user + nice + system + idle + iowait + irq + softirq + steal))
                CPU_IDLE=$((idle + iowait))
                CPU=""
                if [ -f /run/publish-runner-metrics.cpu ]; then
                  read -r PREV_TOTAL PREV_IDLE < /run/publish-runner-metrics.cpu
                  if [ $((CPU_TOTAL - PREV_TOTAL)) -gt 0 ]; then
                    CPU=$((100 * (CPU_TOTAL - PREV_TOTAL - CPU_IDLE + PREV_IDLE) / (CPU_TOTAL - PREV_TOTAL)))
                  fi
                fi
                echo "${!CPU_TOTAL} ${!CPU_IDLE}" > /run/publish-runner-metrics.cpu
                MEMORY=$(awk '/^MemTotal:/ { t = $2 } /^MemAvailable:/ { a = $2 } END { printf "%.1f", (t - a) * 100 / t }' /proc/meminfo)
                SWAP=$(awk '/^SwapTotal:/ { t = $2 } /^SwapFree:/ { f = $2 } END { printf "%.1f", t ? (t - f) * 100 / t : 0 }' /proc/meminfo)
                # % of the last 10s in which every task was stalled waiting for memory (thrashing)
                PRESSURE=$(awk '/^full/ { sub("avg10=", "", $2); print $2 }' /proc/pressure/memory 2> /dev/null || echo 0)
                DIMENSIONS='[{"Name": "AutoScalingGroupName", "Value": "${AWS::StackName}-asg"}, {"Name": "InstanceId", "Value": "'"${!INSTANCE_ID}"'"}]'
                metric() {
                  printf '{"MetricName": "${AWS::StackName}-instance-%s", "Dimensions": %s, "Unit": "%s", "Value": %s}' "$1" "${!DIMENSIONS}" "$2" "$3"
                }
                DATA="$(metric job-count Count "${!JOB_COUNT}"), $(metric memory Percent "${!MEMORY}"), $(metric swap Percent "${!SWAP}"), $(metric memory-pressure Percent "${!PRESSURE:-0}")"
                if [ -n "${!CPU}" ]; then
                  DATA="${!DATA}, $(metric cpu Percent "${!CPU}")"
                fi
                aws cloudwatch put-metric-data \
                  --region ${AWS::Region} \
                  --namespace "${AWS::StackName}-runner-metrics" \
                  --metric-data "[${!DATA}]"
            /etc/systemd/system/publish-runner-metrics.service:
              content: |
                [Unit]
                Description=Publish GitLab Runner job count to CloudWatch
                After=gitlab-runner.service

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/publish-runner-metrics
            /etc/systemd/system/publish-runner-metrics.timer:
              content: |
                [Unit]
                Description=Publish GitLab Runner job count to CloudWatch every 30 seconds

                [Timer]
                OnBootSec=30
                OnUnitActiveSec=30
                AccuracySec=1

                [Install]
                WantedBy=timers.target
            # https://docs.gitlab.com/runner/best_practice/#graceful-shutdown
            /etc/systemd/system/gitlab-runner.service.d/kill.conf:
              content: |
                [Service]
                KillSignal=SIGQUIT
                TimeoutStopSec=3600
          commands:
            00SetNewMachineID:
              command: |
                  sudo rm -f /etc/machine-id ;
                  sudo systemd-firstboot --root=/ --setup-machine-id ;
                  sudo systemctl restart systemd-journald
            01InstallDocker:
              command: sudo dnf -y install docker
            02StartDocker:
              command: sudo systemctl enable --now docker
            # https://docs.gitlab.com/runner/install/linux-repository/
            03AddGitlabRunnerRepository:
              command: curl -fsSL "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.rpm.sh" | sudo bash
            # The package creates the gitlab-runner user and installs the systemd service
            04InstallGitlabRunner:
              command: !If
                - PinGitlabRunnerVersion
                - !Sub "sudo dnf -y install gitlab-runner-${GitlabRunnerVersion} gitlab-runner-helper-images-${GitlabRunnerVersion}"
                - "sudo dnf -y install gitlab-runner"
            05StartGitlabRunner:
              command: sudo systemctl daemon-reload && sudo systemctl enable --now gitlab-runner
            06CreateSwap:
              # Low swappiness keeps swap as a safety net rather than something used routinely
              command: !Sub |
                if [ "${SwapSize}" -gt 0 ] && [ ! -f /swapfile ]; then
                    dd if=/dev/zero of=/swapfile bs=1M count=$((${SwapSize} * 1024)) status=none
                    chmod 600 /swapfile
                    mkswap /swapfile
                    swapon /swapfile
                    echo '/swapfile none swap defaults 0 0' >> /etc/fstab
                    echo 'vm.swappiness = 10' > /etc/sysctl.d/90-swappiness.conf
                    sysctl -p /etc/sysctl.d/90-swappiness.conf
                fi
            08SetRegion:
              command: !Sub 'aws configure set default.region ${AWS::Region}'
            09ConfigureDockerExecutor:
              # Runner settings such as locked, access level and tags are configured in GitLab when the
              # runner is created; gitlab-runner rejects them when registering with an authentication token.
              # The pull policy list goes through a template config: repeating --docker-pull-policy
              # keeps only the last value. request_concurrency lets the runner ask GitLab for up to
              # Concurrent jobs at once; with the default of 1, long polling delays picking up jobs.
              # The cache is shared by all instances through S3, using the instance role.
              command: !Sub |
                cat > /etc/gitlab-runner/register-template.toml <<EOF
                [[runners]]
                  request_concurrency = ${Concurrent}
                  [runners.docker]
                    pull_policy = [$(echo "${DockerPullPolicy}" | sed 's/[^,]*/"&"/g; s/,/, /g')]
                  [runners.cache]
                    Type = "s3"
                    Shared = true
                    [runners.cache.s3]
                      ServerAddress = "s3.amazonaws.com"
                      AuthenticationType = "iam"
                      BucketName = "${RunnerCacheBucket}"
                      BucketLocation = "${AWS::Region}"
                EOF
                for GitlabGroupToken in $(aws ssm get-parameter --name /${AWS::StackName}/runner-tokens --with-decryption --query Parameter.Value --output text | tr ',' ' ');do
                    sudo gitlab-runner register \
                    --non-interactive \
                    --template-config /etc/gitlab-runner/register-template.toml \
                    --url "${GitlabServerURL}" \
                    --token $GitlabGroupToken \
                    --executor "docker" \
                    --docker-image "${DockerImagePath}" \
                    --docker-memory "${JobMemoryLimit}" \
                    --docker-service-memory "${ServiceMemoryLimit}" \
                    --description "Gitlab Runner with Docker Executor" \
                    --docker-volumes "/var/run/docker.sock:/var/run/docker.sock"
                done
            10StartPublishRunnerMetrics:
              command: systemctl daemon-reload && systemctl enable --now publish-runner-metrics.timer
  RunnerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: !Ref DesiredCapacity
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: !Ref MinInstancesInService
        MaxBatchSize: !Ref MaxBatchSize
        PauseTime: "PT15M"
        WaitOnResourceSignals: true
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
          - AZRebalance
          - AlarmNotification
          - ScheduledActions
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-asg
      MaxInstanceLifetime: !Ref MaxInstanceLifetime
      LaunchTemplate:
        LaunchTemplateId: !Ref RunnerLaunchTemplate
        Version: !GetAtt 
          - RunnerLaunchTemplate
          - LatestVersionNumber
      DesiredCapacity: !Ref DesiredCapacity
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      Cooldown: !Ref ScaleInCoolDownInSeconds
      MetricsCollection:
        - Granularity: "1Minute"
          Metrics:
          - "GroupMinSize"
          - "GroupMaxSize"
      Tags:
        - Key: "APP_ID"
          Value: !Ref AppId
          PropagateAtLaunch : true
        - Key: "Name"
          Value: !Ref "InstanceName"
          PropagateAtLaunch : true
        - Key: "COST_CENTER"
          Value: !Ref CostCenter
          PropagateAtLaunch : true
      TerminationPolicies:
        # If the launch configuration is out of date, then replace it.
        # Otherwise we kill the oldest instance and let the runnerManager bring up new instances with latest config ie tokens
        - OldestLaunchConfiguration
        - OldestInstance
      VPCZoneIdentifier: !Ref "SubnetIds"
      ServiceLinkedRoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling"

  RunnerAutoScalingGroupParameter:
    Type: "AWS::SSM::Parameter"
    Properties:
      Name: !Sub "/${AWS::StackName}/runner-autoscaling-group"
      Type: "String"
      Value: !Ref RunnerAutoScalingGroup

  LifecycleHook:
    Type: AWS::AutoScaling::LifecycleHook
    Properties:
      AutoScalingGroupName: !Ref RunnerAutoScalingGroup
      LifecycleTransition: autoscaling:EC2_INSTANCE_TERMINATING

  DocumentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content: !Sub |
        {
          "schemaVersion": "2.2",
          "description": "Gitlab runner graceful shutdown",
          "parameters": {},
          "mainSteps": [
            {
              "action": "aws:runShellScript",
              "name": "TerminateGitlabRunner",
              "inputs":
                {
                  "runCommand": [
                    "ASGNAME='${RunnerAutoScalingGroup}'",
                    "echo $ASGNAME",
                    "LIFECYCLEHOOKNAME='${LifecycleHook}'",
                    "echo $LIFECYCLEHOOKNAME",
                    "TOKEN=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H \"X-aws-ec2-metadata-token-ttl-seconds: 300\")",
                    "INSTANCEID=$(curl -s -H \"X-aws-ec2-metadata-token: ${!TOKEN}\" http://169.254.169.254/latest/meta-data/instance-id)",
                    "echo $INSTANCEID",
                    "REGION=$(curl -s -H \"X-aws-ec2-metadata-token: ${!TOKEN}\" http://169.254.169.254/latest/meta-data/placement/region)",
                    "echo $REGION",
                    "HOOKRESULT='CONTINUE'",
                    "MESSAGE='Gitlab runner process is running'",
                    "echo 'unregistering this runner'",
                    "sudo gitlab-runner unregister --all-runners",
                    "echo 'Waiting for gitlab-runner to stop gracefully'",
                    "sudo gitlab-runner stop",
                    "echo 'completing lifecycle action'",
                    "aws autoscaling complete-lifecycle-action --lifecycle-hook-name ${!LIFECYCLEHOOKNAME} --auto-scaling-group-name ${!ASGNAME} --lifecycle-action-result ${!HOOKRESULT} --instance-id ${!INSTANCEID}  --region ${!REGION}",
                    "echo 'done'"
                  ]
                }
              }
            ]
          }
      Tags:
        - Key: "APP_ID"
          Value: !Ref AppId
        - Key: "COST_CENTER"
          Value: !Ref CostCenter

  LifeCycleHookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-asg-lifecycle-hook
      Description: "Gitlab runner autoscaling group lifecycle hook on instance termination."
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Sub "${AWS::StackName}/${AWS::StackName}-lifecycle-hook-${TimeStamp}.zip"
      Handler: gitlab-runner-lifecycle-hook.lambda_handler
      # TODO: This role is likely too permissive
      Role: !GetAtt GitlabRunnerRole.Arn
      Runtime: python3.13
      # Polls the graceful shutdown command until it starts; the 3 second default cut that short,
      # so the lifecycle hook was never completed and termination waited out the heartbeat timeout
      Timeout: 300
      Environment:
        Variables:
          DOCUMENT_NAME: !Ref Document
          DOCUMENT_LOG_GROUP_NAME: !Ref DocumentLogGroup
      Tags:
        - Key: "APP_ID"
          Value: !Ref AppId
        - Key: "COST_CENTER"
          Value: !Ref CostCenter

  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !GetAtt LifeCycleHookFunction.Arn
      Principal: events.amazonaws.com

  Rule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern: !Sub 
        - |
          {
            "source": ["aws.autoscaling"],
            "detail-type": ["EC2 Instance-terminate Lifecycle Action"],
            "detail": {
              "AutoScalingGroupName": ["${ASG}"]
            }
          }
        - { ASG: !Ref RunnerAutoScalingGroup }
      Targets:
      - Arn: !GetAtt LifeCycleHookFunction.Arn
        Id: target

  RunnerMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: RunnerMonitorPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "autoscaling:DescribeAutoScalingGroups"
                  - "autoscaling:SetDesiredCapacity"
                  - "autoscaling:SetInstanceHealth"
                  - "autoscaling:SetInstanceProtection"
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:PutMetricData"
                Resource:
                  - "*"
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  RunnerMonitorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-runner-monitor
      Description: "Monitors the state of the gitlab runners to trigger autoscaling events"
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Sub "${AWS::StackName}/${AWS::StackName}-runner-monitor-${TimeStamp}.zip"
      Handler: index.handler
      Role: !GetAtt RunnerMonitorRole.Arn
      Runtime: nodejs24.x
      Timeout: 900
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          AUTOSCALING_GROUP_NAME: !Ref RunnerAutoScalingGroup
          MAXIMUM_CONCURRENT_JOBS_PER_RUNNER: !Ref Concurrent
          COUNT_OF_NEW_JOBS_BEFORE_SCALING: !Ref CountOfNewJobsBeforeScaling
          RUNNER_METRIC_NAMESPACE: !Sub "${AWS::StackName}-runner-metrics"
          RUNNER_INSTANCE_JOB_COUNT_METRIC_NAME: !Sub "${AWS::StackName}-instance-job-count"
          RUNNER_JOB_COUNT_METRIC_NAME: !Sub "${AWS::StackName}-job-count"
          RUNNER_TARGET_CAPACITY_METRIC_NAME: !Sub "${AWS::StackName}-target-capacity"
          RUNNER_ACTUAL_CAPACITY_METRIC_NAME: !Sub "${AWS::StackName}-actual-capacity"
      Tags:
        - Key: "APP_ID"
          Value: !Ref AppId
        - Key: "COST_CENTER"
          Value: !Ref CostCenter

  RunnerMonitorLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !GetAtt RunnerMonitorLambda.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExecuteRunnerMonitor.Arn

  ExecuteRunnerMonitor:
    Type: AWS::Events::Rule
    Properties:
      Description: Monitor Gitlab-Runners every minute
      ScheduleExpression: rate(1 minute)
      Targets:
        - Arn: !GetAtt RunnerMonitorLambda.Arn
          Id: TargetFunction1

Outputs:
  RunnerInstanceID:
    Description: "AutoScalingGroup Name of the GITLAB CI Runner is: "
    Value: !Ref "RunnerAutoScalingGroup"
  RunnerCacheBucket:
    Description: S3 bucket holding the shared job cache
    Value: !Ref RunnerCacheBucket